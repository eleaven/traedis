displayName: Traedis
type: middleware
iconPath: assets/icon.png
import: github.com/eleaven/traedis/pkg
basePkg: traedis
summary: 'Redis-backed HTTP cache for Traefik'
testData:
  redis:
    dsn: "redis://localhost:6379/0"
    poolSize: 10
    dialTimeout: 50ms
    timeout: 1s
    maxFailures: 5
    retryAfter: 1s
    tls:
      ca: ""
      insecureSkipVerify: false
  statusCodes: [ 200 ]
  defaultTtl: 5m
  staleTtl: 1h
  defaultStaleWhileRevalidate: 0s
  defaultStaleIfError: 0s
  maxBodyBytes: 5242880
  maxVariants: 16
  maxRevalidations: 10
  revalidationTimeout: 30s
  sortQuery: false
  exposeKey: false
