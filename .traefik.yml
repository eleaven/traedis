displayName: 'Traedis – Redis-backed HTTP Cache'
summary: >-
  Standards-based HTTP cache for Traefik that stores backend responses in Redis. Honors Cache-Control, Vary, ETag and 304 (RFC 9111),
  stale-while-revalidate and stale-if-error (RFC 5861), reports what the cache did for each response in a Cache-Status header (RFC 9211),
  never shares responses meant for a single user, and fails open when Redis is unavailable.
type: middleware
iconPath: assets/icon.png
import: github.com/eleaven/traedis/pkg
basePkg: traedis
testData:
  redis:
    dsn: "redis://localhost:6379/0"
    poolSize: 10
    dialTimeout: 50ms
    timeout: 1s
    maxFailures: 5
    retryAfter: 1s
    tls:
      ca: ""
      insecureSkipVerify: false
  statusCodes: [ 200 ]
  defaultTtl: 5m
  staleTtl: 1h
  defaultStaleWhileRevalidate: 0s
  defaultStaleIfError: 0s
  maxBodyBytes: 5242880
  maxVariants: 16
  maxRevalidations: 10
  revalidationTimeout: 30s
  sortQuery: false
  exposeKey: false
