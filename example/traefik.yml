# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json
log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: true

ping: {} # used by the container healthcheck

entryPoints:
  web:
    address: ":80"
  # As behind a proxy that terminates TLS: X-Forwarded-Proto is trusted, from anyone. Not published: only the
  # end-to-end tests use it
  proxied:
    address: ":81"
    forwardedHeaders:
      insecure: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

experimental:
  localPlugins:
    traedis:
      moduleName: github.com/eleaven/traedis
