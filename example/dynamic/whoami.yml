# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
http:
  routers:
    whoami-cache:
      rule: PathPrefix(`/whoami-cache`)
      middlewares:
        - whoami-cache
      service: whoami
    # Stale responses: here the backend sends `stale-while-revalidate` and `stale-if-error`, and its status can be
    # changed: `curl -d 503 http://localhost:8080/whoami-stale/health`, then GET the same URL
    whoami-stale:
      rule: PathPrefix(`/whoami-stale`)
      middlewares:
        - whoami-client # acts on the Cache-Control of clients: e2e/tests/stale.hurl reloads like a browser
        - whoami-stale-headers # after the cache: for the cache, these headers come from the backend
        - whoami-stale-prefix
      service: whoami
    # Same thing for a backend that sends neither: the cache is configured to serve its responses stale
    whoami-stale-default:
      rule: PathPrefix(`/whoami-stale-default`)
      middlewares:
        - whoami-stale-default
        - whoami-stale-prefix
      service: whoami
    # Variants: here the backend answers by `Accept-Language` (whoami echoes the request headers) and compresses
    # by `Accept-Encoding`: `curl -H 'Accept-Language: fr' --compressed http://localhost:8080/whoami-vary`
    whoami-vary:
      rule: PathPrefix(`/whoami-vary`)
      middlewares:
        - whoami-vary
        - whoami-vary-headers # after the cache: for the cache, `Vary` and the compression come from the backend
        - whoami-vary-compress
      service: whoami
    # Cookies: here the backend sets a cookie and tells caches not to store it (`private="Set-Cookie"`): the
    # response is cached without it. /whoami-cookie-public only says `public`: it is not cached at all
    whoami-cookie:
      rule: PathPrefix(`/whoami-cookie`)
      middlewares:
        - whoami-cache
        - whoami-cookie-headers # after the cache: for the cache, these headers come from the backend
      service: whoami
    whoami-cookie-public:
      rule: PathPrefix(`/whoami-cookie-public`)
      middlewares:
        - whoami-cache
        - whoami-cookie-public-headers
      service: whoami
    # Query sorting: here `?a=1&b=2` and `?b=2&a=1` share the same cached response
    whoami-sort-query:
      rule: PathPrefix(`/whoami-sort-query`)
      middlewares:
        - whoami-sort-query
      service: whoami
    # Middleware names: here two routers match the same URL, each with a middleware of its own. Their responses
    # are stored apart: `curl -H 'X-Tenant: b' http://localhost:8080/whoami-key` never gets those of the other one
    whoami-key:
      rule: PathPrefix(`/whoami-key`)
      middlewares:
        - whoami-key
      service: whoami
    whoami-key-tenant:
      rule: PathPrefix(`/whoami-key`) && Header(`X-Tenant`, `b`)
      middlewares:
        - whoami-key-tenant
      service: whoami
    # TLS to Redis: here the cache is in `cache-tls`, whose certificate is verified with `redis.tls.ca`.
    # /whoami-tls-untrusted has no `redis.tls.ca`: the certificate is refused and the cache bypassed
    whoami-tls:
      rule: PathPrefix(`/whoami-tls`)
      middlewares:
        - whoami-tls
      service: whoami
    whoami-tls-untrusted:
      rule: PathPrefix(`/whoami-tls-untrusted`)
      middlewares:
        - whoami-tls-untrusted
      service: whoami
    # Request directives: by default the cache ignores the Cache-Control of clients, which this middleware acts on:
    # `curl -H 'Cache-Control: no-cache' http://localhost:8080/whoami-client` reaches the backend
    whoami-client:
      rule: PathPrefix(`/whoami-client`)
      middlewares:
        - whoami-client
      service: whoami
    whoami:
      rule: PathPrefix(`/whoami`)
      service: whoami

  middlewares:
    whoami-cookie-headers:
      headers:
        customResponseHeaders:
          Cache-Control: 'max-age=60, private="Set-Cookie"'
          Set-Cookie: "sid=e2e-secret"
    whoami-cookie-public-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=60"
          Set-Cookie: "sid=e2e-secret"
    whoami-vary-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "max-age=60"
          # On every response: `compress` only adds `Vary: Accept-Encoding` to those it compresses, and a response
          # without `Vary` would be served to all
          Vary: "Accept-Language, Accept-Encoding"
    whoami-vary-compress:
      compress:
        encodings: [ br, gzip ]
        minResponseBodyBytes: 1 # whoami's responses are tiny
    whoami-stale-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "max-age=2, stale-while-revalidate=10, stale-if-error=60"
    whoami-stale-prefix:
      stripPrefix:
        prefixes:
          - /whoami-stale-default # first: the other one is its prefix
          - /whoami-stale
    whoami-cache:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          maxBodyBytes: 5120 # 5 KiB
    whoami-client:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          ignoreClientCacheControl: false # on by default: request directives are advisory (RFC 9111 §5.2.1)
    whoami-vary:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          maxVariants: 3 # per URL; 16 by default
    whoami-sort-query:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          sortQuery: true # off by default: for RFC 9111, these are two URLs
    whoami-key:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          exposeKey: true # the Redis key in `Cache-Status`: it starts with the name of the middleware
    whoami-key-tenant:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          exposeKey: true
    whoami-tls:
      plugin:
        traedis:
          redis:
            dsn: "rediss://cache-tls:6379/0"
            tls:
              ca: /certs/redis.crt # self-signed: not one of the authorities of the system
    whoami-tls-untrusted:
      plugin:
        traedis:
          redis:
            dsn: "rediss://cache-tls:6379/0"
    whoami-stale-default:
      plugin:
        traedis:
          redis:
            dsn: "redis://cache:6379/2"
          defaultTtl: 2s
          defaultStaleWhileRevalidate: 10s
          defaultStaleIfError: 1m
          ignoreClientCacheControl: false # e2e/tests/stale.hurl reloads like a browser

  services:
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"
