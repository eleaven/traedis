name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  # vMAJOR.MINOR.PATCH, no leading zeros: what Go modules and the Traefik Plugin Catalog expect
  SEMVER: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

jobs:
  # Unit tests
  unit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TRAEDIS_REDIS_DSN: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The interpreter Traefik v3.7 embeds: this is what runs in production.
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: yaegi test -v .
        working-directory: pkg

  # End-to-end tests: the plugin loaded by Traefik (Yaegi), with Redis and the sample backends
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --wait: until healthy (ingress, cache, whoami, imaging) or running (placeholder has no healthcheck)
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache whoami placeholder imaging
      - run: ./e2e/run.sh
      - name: Report
        if: ${{ !cancelled() }}
        run: node e2e/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Benchmarks of the pushed code: in-process under Yaegi, then k6 through Traefik (without and
  # with the cache). Informational only: shared runners are too noisy to gate on timings, so the
  # release jobs don't need it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache whoami placeholder imaging
      - run: ./benchmark/run.sh
      # Not on failure: results.json would still be the committed one, not this run's
      - name: Report
        run: node benchmark/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Release, on main only and once the tests pass: `detect-new-version` and `release` need
  # `validate-version`, so they are skipped with it (pull requests, failed tests).

  # Reads ./VERSION and fails when it is not a valid version
  validate-version:
    needs: [ unit, e2e ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse VERSION
        id: version
        run: |
          version="$(<VERSION)"
          if [[ ! "$version" =~ $SEMVER ]]; then
            echo "::error file=VERSION::'$version' is not a valid version (expected vMAJOR.MINOR.PATCH, e.g. v1.2.3)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Is the version a new one, and does it follow the highest released one?
  detect-new-version:
    needs: validate-version
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.tags.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the released versions
        id: tags
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail

          tags="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')"
          if grep -qxF "$VERSION" <<< "$tags"; then
            echo "$VERSION is already released: nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Incremental: the next patch, minor or major of the highest released version
          latest="$(grep -E "$SEMVER" <<< "$tags" | sort -V | tail -n 1 || true)"
          if [[ "$latest" =~ $SEMVER ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next_patch="v$major.$minor.$((patch + 1))"
            next_minor="v$major.$((minor + 1)).0"
            next_major="v$((major + 1)).0.0"
            if [[ "$VERSION" != "$next_patch" && "$VERSION" != "$next_minor" && "$VERSION" != "$next_major" ]]; then
              echo "::error file=VERSION::$VERSION does not follow $latest (expected $next_patch, $next_minor or $next_major)"
              exit 1
            fi
          fi

          echo "new=true" >> "$GITHUB_OUTPUT"

  # Creates the tag and the GitHub release
  release:
    needs: [ validate-version, detect-new-version ]
    if: needs.detect-new-version.outputs.new == 'true'
    runs-on: ubuntu-latest
    # One release at a time: two pushes must not race for the same tag
    concurrency:
      group: release
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
