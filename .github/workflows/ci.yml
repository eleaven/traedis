name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests
  unit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TRAEDIS_REDIS_DSN: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The interpreter Traefik v3.7 embeds: this is what runs in production.
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: yaegi test -v .
        working-directory: pkg

  # Each fuzzer for a short while: their seeds already ran with the unit tests. No Redis: they only parse
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Fuzz
        run: |
          for target in $(go test -list '^Fuzz' ./pkg | grep '^Fuzz'); do
            echo "# $target"
            go test -run '^$' -fuzz "^$target\$" -fuzztime 10s ./pkg
          done
      # The input that failed, written to pkg/testdata/fuzz on the runner: to commit with its fix
      - name: Failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-testdata
          path: pkg/testdata/fuzz

  # End-to-end tests: the plugin loaded by Traefik (Yaegi), with Redis and the sample backends
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --wait: until healthy (ingress, cache, cache-tls, whoami, imaging) or running (placeholder has no healthcheck)
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache cache-tls whoami placeholder imaging
      - run: ./e2e/run.sh
      - name: Report
        if: ${{ !cancelled() }}
        run: node .github/scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Benchmarks of the pushed code: in-process under Yaegi, then k6 through Traefik (without and with the cache). Informational only: shared
  # runners are too noisy to gate on timings, so the release job does not need it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache cache-tls whoami placeholder imaging
      - run: ./benchmark/run.sh
      # Not on failure: there is no results.json then
      - name: Report
        run: node .github/scripts/bench-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Is ./VERSION a valid version, and a new one that follows the highest released one, with its section in CHANGELOG.md? On pull requests
  # too: a version that cannot be released is refused before it is merged
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.version.outputs.new }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # 1. The version, and whether it is a new one
      - name: Check the version
        id: version
        run: .github/scripts/version.sh

      # 2. The notes of a new version: its section in CHANGELOG.md
      - name: Check the notes of the version
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" >/dev/null

  # Release of a new version, on main only and once the tests pass: its tag and its GitHub release. Skipped otherwise, which tells at a
  # glance whether a push released something
  release:
    needs: [ unit, fuzz, e2e, version ]
    if: github.event_name == 'push' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    # One release at a time: two pushes must not race for the same tag
    concurrency:
      group: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Create the tag and the release, with its notes from CHANGELOG.md and the GitHub CLI of the runner: no third-party action in the job,
      # which may write to the repository. --generate-notes adds the link to the comparison with the previous version after the notes. The
      # notes are read on a line of their own, which fails the step when they cannot be: as an argument of gh, the failure would be ignored
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(.github/scripts/release-notes.sh "$VERSION")"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "$notes" --generate-notes
