name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Unit tests
  unit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TRAEDIS_REDIS_DSN: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Each fuzzer for a short while: their seeds already ran with the tests
      - name: Fuzz
        run: |
          for target in $(go test -list '^Fuzz' ./pkg | grep '^Fuzz'); do
            echo "# $target"
            go test -run '^$' -fuzz "^$target\$" -fuzztime 10s ./pkg
          done
      # The interpreter Traefik v3.7 embeds: this is what runs in production.
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: yaegi test -v .
        working-directory: pkg

  # End-to-end tests: the plugin loaded by Traefik (Yaegi), with Redis and the sample backends
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --wait: until healthy (ingress, cache, cache-tls, whoami, imaging) or running (placeholder has no healthcheck)
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache cache-tls whoami placeholder imaging
      - run: ./e2e/run.sh
      - name: Report
        if: ${{ !cancelled() }}
        run: node .github/scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Benchmarks of the pushed code: in-process under Yaegi, then k6 through Traefik (without and
  # with the cache). Informational only: shared runners are too noisy to gate on timings, so the
  # release job does not need it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go install github.com/traefik/yaegi/cmd/yaegi@v0.16.1
      - run: docker compose up -d --wait --wait-timeout 120 ingress cache cache-tls whoami placeholder imaging
      - run: ./benchmark/run.sh
      # Not on failure: there is no results.json then
      - name: Report
        run: node .github/scripts/bench-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Release, on main only and once the tests pass: the version of ./VERSION, when it is a new one, gets its tag and its
  # GitHub release, with its notes from CHANGELOG.md
  release:
    needs: [ unit, e2e ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One release at a time: two pushes must not race for the same tag
    concurrency:
      group: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 1. Is ./VERSION a valid version, and a new one that follows the highest released one? The next steps only run
      # for a new one
      - name: Check the version
        id: version
        run: .github/scripts/version.sh

      # 2. Create the tag and the release, with its notes from CHANGELOG.md and the GitHub CLI of the runner: no
      # third-party action in the job, which may write to the repository. --generate-notes adds the link to the
      # comparison with the previous version after the notes. The notes are read on a line of their own, which fails
      # the step when they cannot be: as an argument of gh, the failure would be ignored
      - name: Create the tag and the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(.github/scripts/release-notes.sh "$VERSION")"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "$notes" --generate-notes
